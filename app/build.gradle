plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.blurtopian.dpolls'
    compileSdk 34

    defaultConfig {
        applicationId "com.blurtopian.dpolls"
        minSdk 34
        targetSdk 34
        versionCode 4
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Blockchain configuration - Default to testnet
        buildConfigField "String", "NERO_RPC_URL", '"https://rpc-testnet.nerochain.io"'
        buildConfigField "String", "NERO_CHAIN_ID", '"689"'
        buildConfigField "String", "POLLS_CONTRACT_ADDRESS", '"0x755934906e7783B2CfE16381A8Dd41E0Ad3Ffbe1"'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            // Debug uses testnet
            buildConfigField "String", "NERO_RPC_URL", '"https://rpc-testnet.nerochain.io"'
            buildConfigField "String", "NERO_CHAIN_ID", '"689"'
            buildConfigField "String", "POLLS_CONTRACT_ADDRESS", '"0x755934906e7783B2CfE16381A8Dd41E0Ad3Ffbe1"'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release uses mainnet
            buildConfigField "String", "NERO_RPC_URL", '"https://rpc.nerochain.io"'
            buildConfigField "String", "NERO_CHAIN_ID", '"1689"'
            buildConfigField "String", "POLLS_CONTRACT_ADDRESS", '"0x71322f1Bb13f0857410f2ebd4BC6ad731f2De6E5"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
        viewBinding true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.4.7'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/DEPENDENCIES'
            excludes += '/META-INF/LICENSE'
            excludes += '/META-INF/LICENSE.txt'
            excludes += '/META-INF/NOTICE'
            excludes += '/META-INF/NOTICE.txt'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2023.10.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Core Android dependencies
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Compose BOM and UI
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:$navigation_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"

    // ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"

    // Dependency Injection - Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // Room Database
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Blockchain Integration - Web3j
    implementation "org.web3j:core:$web3j_version"
    implementation "org.web3j:crypto:$web3j_version"
    implementation "org.web3j:utils:$web3j_version"
    implementation "org.web3j:abi:$web3j_version"
    implementation "org.web3j:contracts:$web3j_version"
    implementation 'org.slf4j:slf4j-android:1.7.36'

    // Blockchain Integration - web3.kt
    implementation("com.github.komputing.kethereum:model:$kethereum_version") // core model
    implementation("com.github.komputing.kethereum:rpc:$kethereum_version")   // for JSON-RPC
    implementation("com.github.komputing.kethereum:wallet:$kethereum_version") // for wallet/private key
    implementation("com.github.komputing.kethereum:abi:$kethereum_version")    // for ABI encoding
    implementation("com.github.komputing.kethereum:crypto:$kethereum_version") // for signing tx

    // Web3Auth SDK
    implementation 'com.github.web3auth:web3auth-android-sdk:9.0.0'

    // Networking
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Image Loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // JSON Parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Date and Time
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.5.0'
    
    // Biometric Authentication
    implementation 'androidx.biometric:biometric:1.1.0'

    // Security
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-messaging'

    // QR Code
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation "androidx.room:room-testing:$room_version"

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation "androidx.navigation:navigation-testing:$navigation_version"
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kaptAndroidTest "com.google.dagger:hilt-compiler:$hilt_version"

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

